name: green_taxi
version: "1.0.0"
profile: green_taxi

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Reporting period; the end date is exclusive. The pipeline sets both from
  # --months (dbt build --vars ...); these defaults match its default months.
  period_start: "2023-10-01"
  period_end: "2025-04-01"

models:
  green_taxi:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  green_taxi:
    +schema: reference
