version: 2

sources:
  - name: raw
    schema: raw
    description: Unchanged copy of the TLC Green Taxi Parquet files, loaded by green_taxi.load.
    tables:
      - name: green_trips
        description: One row per trip record, as published, plus source_file and loaded_at.
        columns:
          - name: lpep_pickup_datetime
            data_tests:
              - not_null
          - name: total_amount
            data_tests:
              - not_null
          - name: source_file
            data_tests:
              - not_null
